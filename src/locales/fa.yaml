      tip: پایگاه داده IndexedDB همه سایت‌ها
    localStorage:
      label: حافظه محلی (Local Storage)
      tip: حافظه محلی همه سایت‌ها
    serviceWorkers:
      label: سرویس ورکرها (Service Workers)
      tip: سرویس ورکرهای همه سایت‌ها
    webSQL:
      label: پایگاه داده Web SQL
      tip: پایگاه داده Web SQL همه سایت‌ها (منسوخ‌شده)

    cache:
      label: کش مرورگر
      tip: کش مرورگر
    downloads:
