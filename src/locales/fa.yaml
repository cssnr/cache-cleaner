# Options

option:
  toggle:
    autoReload:
      label: بارگذاری مجدد خودکار سایت
      tip: رفرش کردن سایت پس از پاک کردن کش.
    showAllButtons:
      label: نمایش همه دکمه‌ها
      tip: نمایش دکمه‌های سایت و مرورگر در پاپ‌آپ.
    popupBrowser:
      label: مرورگر به عنوان پیش‌فرض
      tip: نمایش تب مرورگر هنگام باز کردن پاپ‌آپ.
    showConfirmation:
      label: نمایش تاییدیه
      tip: نمایش پیام تایید قبل از پاک کردن کش.
    showDeprecated:
      label: نمایش گزینه‌های منسوخ‌شده
      tip: نمایش گزینه‌هایی که دیگر پشتیبانی نمی‌شوند (Deprecated).
    contextMenu:
      label: نمایش منوی کلیک‌راست
      tip: نمایش گزینه‌ها در منوی کلیک‌راست.
    contextAction:
      label: نمایش همه موارد روی آیکون نوار ابزار
      tip: نمایش تمام موارد منو هنگام کلیک‌راست روی آیکون افزونه.
    showErrorNotifications:
      label: نمایش اعلان‌های خطا
      tip: برای منوی کلیک‌راست و میانبرهای صفحه‌کلید.
    showUpdate:
      label: نمایش یادداشت‌های انتشار هنگام بروزرسانی
      tip: نمایش اعلان‌های مربوط به بروزرسانی افزونه.

  confirm:
    site:
      label: کش سایت
      tip: کش سایت
    siteAll:
      label: کش همه سایت‌ها
      tip: کش همه سایت‌ها
    browser:
      label: کش مرورگر
      tip: کش مرورگر
    browserAll:
      label: کش کل مرورگر
      tip: کش کل مرورگر

  site:
    cache:
      label: کش سایت
      tip: کش مرورگر برای این سایت
    appcache:
      label: کش برنامه (App Cache)
      tip: کش برنامه مرورگر (منسوخ‌شده)
    cacheStorage:
      label: حافظه کش (Cache Storage)
      tip: حافظه کش سایت
    cookies:
      label: کوکی‌ها
      tip: کوکی‌های سایت
    fileSystems:
      label: فایل سیستم‌ها
      tip: فایل سیستم‌های سایت (منسوخ‌شده)
    indexedDB:
      label: پایگاه داده (IndexedDB)
      tip: پایگاه داده IndexedDB سایت
    localStorage:
      label: حافظه محلی (Local Storage)
      tip: حافظه محلی سایت
    serviceWorkers:
      label: سرویس ورکرها (Service Workers)
      tip: سرویس ورکرهای سایت
    webSQL:
      label: پایگاه داده Web SQL
      tip: پایگاه داده Web SQL سایت (منسوخ‌شده)

  browser:
    appcache:
      label: کش برنامه (App Cache)
      tip: کش برنامه مرورگر (منسوخ‌شده)
    cacheStorage:
      label: حافظه کش (Cache Storage)
      tip: حافظه کش همه سایت‌ها
    cookies:
      label: کوکی‌ها
      tip: کوکی‌های همه سایت‌ها
    fileSystems:
      label: فایل سیستم‌ها
      tip: فایل سیستم‌های همه سایت‌ها
    indexedDB:
